[workspace]
resolver = "3"
members = [
    "alloc",
    "capsules",
    "fip/core",
    "fip/macros",
    "fip/x86_64",
    "fip/aarch64",
    "fip/riscv64",
    "ipc",
    "scudo-sys",
]

# `kernel/` (root task) stays outside the workspace — its own
# .cargo/config.toml pins x86_64-unknown-none; `just bare-metal` builds it.
# `fip/` holds the Y4-FIP crates; fip/aarch64 and fip/riscv64 stay members
# by user decision 2026-10-31 (bare-metal + QEMU gates, not x86_64-only).
# HIU-touching crates (hiu/, hiu/mock/, hiu/lease) are unblocked since
# docs/hiu_abi.md became v1.0 frozen (2026-10-22) but not started.

# `proofs/verus/` is intentionally NOT a workspace member.  Verus uses its
# own rustc fork, depends on `vstd` which is shipped with the Verus install
# (e.g. /opt/verus/libvstd.rlib from the verus-bin AUR package) rather than
# crates.io, and is invoked directly by the `verus` CLI from
# `proofs/verus/justfile`.  Including it here would force cargo to resolve
# `use vstd::prelude::*;` against a non-existent crates.io entry.
#
# `kernel/` is excluded because it builds for `x86_64-unknown-none` (its
# own .cargo/config.toml selects the target) — it is not a hosted Rust
# crate and would derail `cargo build --workspace`.  Build it via
# `just kernel-build`.
exclude = ["proofs/verus", "kernel", "verus-fork"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
authors = ["윤병익 (BYUNG-IK YEUN) and Y4 contributors"]
license = "Apache-2.0"
repository = "https://github.com/y4-hypervisor/y4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Workspace-wide allowances are added here only with rationale.
